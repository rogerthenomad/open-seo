name: Upload sourcemaps
on:
  push:
    branches:
      - main
concurrency:
  group: sourcemaps-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The public mirror never uploads. Any other copy of the repo uploads only
  # once POSTHOG_CLI_TOKEN is configured, so a private copy or fork without it
  # stays green instead of failing every push to main. The secrets context is
  # not available in a job-level `if`, so this gate turns "is PostHog
  # configured" into an output that `upload` can branch on. Skipping the whole
  # job matters: guarding only the inner steps leaves setup-node's post-run
  # cache save looking for a pnpm store that `pnpm install` never created,
  # which fails the run.
  gate:
    if: github.repository != 'every-app/open-seo'
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check whether PostHog is configured
        id: check
        env:
          POSTHOG_CLI_TOKEN: ${{ secrets.POSTHOG_CLI_TOKEN }}
        run: |
          if [ -n "$POSTHOG_CLI_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "POSTHOG_CLI_TOKEN is not configured, skipping sourcemap upload."
          fi

  upload:
    needs: gate
    if: needs.gate.outputs.configured == 'true'
    runs-on: ubuntu-latest
    env:
      POSTHOG_SOURCEMAPS: "true"
      POSTHOG_CLI_HOST: ${{ vars.POSTHOG_CLI_HOST }}
      POSTHOG_CLI_ENV_ID: ${{ vars.POSTHOG_CLI_ENV_ID }}
      POSTHOG_CLI_TOKEN: ${{ secrets.POSTHOG_CLI_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and upload sourcemaps
        run: pnpm run sourcemaps:upload
